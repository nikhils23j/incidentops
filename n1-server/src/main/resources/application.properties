spring.application.name=incidentops
# New file name: the v2 schema adds NOT NULL columns that would not migrate cleanly onto the old v1 file.
spring.datasource.url=jdbc:h2:file:./data/incidentops-v2
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info

# On-call rotation (placeholder names; nobody actually gets paged) and acknowledgement SLAs per severity.
incidentops.oncall=responder-a,responder-b,responder-c
incidentops.ack-sla.CRITICAL=5m
incidentops.ack-sla.HIGH=15m
incidentops.ack-sla.MEDIUM=1h
incidentops.ack-sla.LOW=4h
incidentops.max-escalation-level=3
incidentops.sla.scan-interval-ms=5000
